<!DOCTYPE html>
<html lang = "en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content = "width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/part1.css">
    <title>
        Contact (No Javascript) | My Portfolio
    </title>
</head>
<body>
    <header>
        <nav aria-label="Main">
            <ul>
                <li> <a href="index.html">Home</a> </li>
                <li> <a href="form-no-js.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Me!</h1>

        <form class = "contact-form" action="https://httpbin.org/post" method = "post">

            <div class = "form-field">
                <label for = "name">Name</label>
                <input type="text" id = "name" name ="name" autocomplete="name" required
                minlength ="1" maxlength="100">
            </div>

            <div class = "form-field">
                <label for="email">Email Address</label>
                <input type="email" id = "email" name = "email" autocomplete="email" required>
            </div>

            <div class = "form-field">
                <label for="comments">Comments</label>
                <textarea id = "comments" name="comments" rows="6" required minlength="10"
                maxlength="1000"></textarea>
            </div>

            <input type ="hidden" name="possible_bot" value="true">

            <button type="submit">Send Message</button>
        </form>
    </main>
</body>
</html>
