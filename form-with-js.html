<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content = "width=device-width, initial-scale = 1">
    <title>Contact(With Javascript)</title>
    <link rel="stylesheet" href="css/part1.css">
    <script src = "/scripts/forms.js" defer></script>
    <script src="scripts/theme.js"></script>
</head>
<body>
    <header>
        <nav aria-label="Main"></nav>
    </header>

    <main>
        <h1>Contact Me!</h1>

        <form class="contact-form" action="https://httpbin.org/post" method="post" aria aria-describedby="form-help">
            <div class = "form-field">
                <label for = "name">Name</label>
                <input type="text" id = "name" name ="name" autocomplete="name" required
                minlength ="1" maxlength="100">
                <p class = "field=error" id="name-error"></p>
            </div>

            <div class = "form-field">
                <label for="email">Email Address</label>
                <input type="email" id = "email" name = "email" autocomplete="email" required>
                <p class = "field=error" id="email-error"></p>
            </div>

            <div class = "form-field">
                <label for="comments">Comments</label>
                <textarea id = "comments" name="comments" rows="6" required minlength="10"
                maxlength="1000"></textarea>
                <p class = "field=error" id="comments-error"></p>
            </div>
        
            <section id="info-area" class="info-area js-only" aria-labelledby="info-heading"
            data-state="normal" hidden>
                
                <h2 id="info-heading">Message length</h2>
                <p id = "char-count" class ="char-count"></p>
                <p id = "length-warning" class="length-warning" role="status"></p>        
            </section>

            <div id="error-area" class="js-only" aria-live="polite" hidden >
                <div id = "error-panel" class="error-panel" hidden>
                    <h2 id="error-heading">Error detected. Please fix.</h2>
                    <ul id = "error-list"></ul>
                </div>
            </div>

            <input type ="hidden" name="possible_bot" value="true">

            <button type="submit">Send Message</button>
        </form>
    </main>
</body>
</html>
